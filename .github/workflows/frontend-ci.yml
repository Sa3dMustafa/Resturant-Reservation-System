name: Savora Frontend CI/CD

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/sa3dmustafa/savora-frontend

jobs:
  build-and-deploy:

    name: Build, Push & Deploy Frontend

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      # ========================================
      # 1. Checkout
      # ========================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ========================================
      # 2. Setup Node.js
      # ========================================

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm


      # ========================================
      # 3. Install dependencies
      # ========================================

      - name: Install dependencies
        run: npm ci


      # ========================================
      # 4. Lint
      # ========================================

      - name: Lint
        run: npm run lint


      # ========================================
      # 5. Build Next.js
      # ========================================

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}


      # ========================================
      # 6. Login to GHCR
      # ========================================

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ========================================
      # 7. Build & Push Docker Image
      # ========================================

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile

          push: true

          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}

          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}


      # ========================================
      # 8. Deploy to EC2
      # ========================================

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |

            set -e

            echo "======================================"
            echo "Deploying Savora Frontend"
            echo "======================================"

            cd ~/savora

            echo "Frontend image:"
            echo "${{ env.IMAGE_NAME }}:${{ github.sha }}"

            # Set the exact frontend image for this deployment
            export FRONTEND_IMAGE="${{ env.IMAGE_NAME }}:${{ github.sha }}"

            echo "Pulling frontend image..."

            docker compose pull frontend

            echo "Starting frontend..."

            docker compose up -d frontend

            echo "Cleaning unused Docker images..."

            docker image prune -f

            echo "======================================"
            echo "Frontend deployed successfully!"
            echo "======================================"

            echo "Running containers:"

            docker compose ps